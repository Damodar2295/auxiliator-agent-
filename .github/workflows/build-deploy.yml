name: Build and update chart
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Deployment environment
        required: true
        default: E1
        type: choice
        options: [E1, E2, E3]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t REPLACE_WITH_REGISTRY/auxiliator-agent:${{ github.sha }} .
      - name: Registry integration placeholder
        run: echo "Configure the approved registry action and secrets before enabling push"
