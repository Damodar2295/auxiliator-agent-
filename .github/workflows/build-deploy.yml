name: Build and update chart
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Deployment environment
        required: true
        default: E1
        type: choice
        options: [E1, E2, E3]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Backend quality gate
        run: |
          uv venv
          uv pip install -e '.[test]'
          .venv/bin/ruff check .
          .venv/bin/mypy agent config
          .venv/bin/pytest -q
      - name: Frontend quality gate
        working-directory: frontend
        run: npm ci && npm run lint && npm test -- --run && npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t REPLACE_WITH_REGISTRY/auxiliator-agent:${{ github.sha }} .
      - name: Registry integration placeholder
        run: echo "Configure the approved registry action and secrets before enabling push"
