[project]
name = "auxiliator-agent"
version = "0.1.0"
description = "Auxiliator rebuilt on the AIX/LangGraph agent boilerplate"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=23",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "jproperties>=2.1",
  "PyYAML>=6.0",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "psycopg[binary]>=3.2",
  "mcp[cli]>=2.0,<3.0",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2.0"]
observability = ["langfuse>=3"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires live enterprise infrastructure"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "SIM117"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["agent*", "config*"]
